name: Update Lotto 6/49 + Lotto Max results

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest results
        run: python3 scripts/update_cdn.py
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "actions@github.com"
          git add cdn_recent.json
          if ! git diff --cached --quiet; then
            git commit -m "results: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          else
            echo "No change."
          fi
